name: Gameplay QA diagnostics
on:
  push:
    branches: [arena/f3a68c52-fpp]
    paths: ['.github/workflows/gameplay-diagnostics.yml']
  workflow_run:
    workflows: [Android APK]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/f3a68c52-fpp
      - name: Read completed-run failures without exposing activation logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id || '42365618935' }}
        run: |
          gh run view "$RUN" --log > /tmp/failed.log || true
          gh api "repos/$GH_REPO/actions/runs/$RUN/logs" > /tmp/run-logs.zip || true
          python - <<'PYPUBLISH'
          import zipfile,pathlib,re
          try:
              with zipfile.ZipFile('/tmp/run-logs.zip') as z:
                  for name in z.namelist():
                      if 'Publish small' not in name:continue
                      safe=[]
                      for line in z.read(name).decode(errors='replace').splitlines():
                          if re.search(r'password|email|serial|token|credential|https?://',line,re.I):continue
                          safe.append('PUBLISH_DIAGNOSTIC '+line[:700])
                      with open('/tmp/failed.log','a') as f:f.write('\n'+'\n'.join(safe))
          except zipfile.BadZipFile:pass
          PYPUBLISH
          python - <<'PY'
          import re,json,os,pathlib
          lines=pathlib.Path('/tmp/failed.log').read_text(errors='replace').splitlines()
          selected=[]
          for line in lines:
              if re.search(r'password|email|serial|token|credential|https?://|signature',line,re.I):continue
              if not re.search(r'PUBLISH_DIAGNOSTIC|error CS\d+|Exception:|Error:|ERROR|FAIL|failed|not found|Unknown|Unsupported|Fpp\.| at .*Assets|ignored|pathspec|hint:|Process completed|Assertion|fatal:|Permission denied|No such file|Traceback|Total tests|Tests run|No tests|Expected:|But was:|Result:|Tests run:|Results:|activation failed|License error',line,re.I):continue
              line=re.sub(r'[^\s@]+@[^\s@]+','[EMAIL]',line)
              selected.append(line[-700:])
          root=pathlib.Path('QA');root.mkdir(exist_ok=True)
          path=root/('native-diagnostic-'+os.environ['RUN']+'.json')
          path.write_text(json.dumps({'run':os.environ['RUN'],'kind':'filtered completed-job diagnostic; not proof of acceptance','messages':selected[-180:]},indent=2))
          print('Filtered diagnostic lines:',len(selected))
          PY
          gh run download "$RUN" --pattern 'gameplay-qa-*' --dir /tmp/previous-qa || true
          python - <<'PYXML'
          import pathlib,json,xml.etree.ElementTree as E,os
          results=[]
          for p in pathlib.Path('/tmp/previous-qa').rglob('*results.xml'):
              root=E.parse(p).getroot();result={'root':root.attrib,'cases':[]}
              for t in root.iter('test-case'):
                  case={k:t.get(k) for k in ('name','result','duration')}
                  failure=t.find('failure/message')
                  if failure is not None:case['failure']=(failure.text or '')[:1800]
                  result['cases'].append(case)
              results.append(result)
          pathlib.Path('QA/recovered-results-'+os.environ['RUN']+'.json').write_text(json.dumps(results,indent=2))
          PYXML
          python -m pip install --quiet pillow==12.0.0
          python - <<'PYRECOVER'
          from pathlib import Path
          import shutil,os,subprocess,io
          from PIL import Image
          for result in Path('/tmp/previous-qa').rglob('test-results'):
              if not result.is_dir():continue
              shutil.copytree(result,'QA/test-results',dirs_exist_ok=True)
              runtime=result.parent/'runtime'
              if runtime.exists():shutil.copytree(runtime,'QA/runtime',dirs_exist_ok=True)
              env=dict(os.environ,RUN_ID=os.environ['RUN'])
              subprocess.run(['python','Tools/summarize_gameplay_qa.py'],env=env,check=True)
              review=Path('QA/Review-'+os.environ['RUN']);review.mkdir(exist_ok=True);budget=400000
              for name in ('ak47-idle','ak47-ads','ak47-fire','ak47-tactical-0.40','ak47-sprint'):
                  source=runtime/(name+'.png')
                  if not source.exists():continue
                  image=Image.open(source).convert('RGB');image.thumbnail((960,540))
                  data=io.BytesIO();image.save(data,format='JPEG',quality=72,optimize=True)
                  if len(data.getvalue())<=budget:(review/(name+'.jpg')).write_bytes(data.getvalue());budget-=len(data.getvalue())
              break
          PYRECOVER
          git add QA
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Preserve filtered native gameplay QA diagnostic'
            git pull --rebase origin arena/f3a68c52-fpp
            git push origin HEAD:arena/f3a68c52-fpp
          fi
