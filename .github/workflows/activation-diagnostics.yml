name: Safe Unity build diagnostics
on:
  push:
    branches: [arena/f3a68c52-fpp]
    paths: ['.github/workflows/activation-diagnostics.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Android workflow run to inspect
        required: true
        default: '42213860584'
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Classify completed build without publishing private logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id || '42213860584' }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: python
        run: |
          import json, os, re, subprocess
          repo=os.environ['REPO']; run=os.environ['RUN_ID']
          assert run.isdigit()
          result=subprocess.run(['gh','run','view',run,'--repo',repo,'--log'],capture_output=True,text=True)
          if result.returncode:
              print('::error::Could not retrieve completed workflow logs with the Actions token.')
              raise SystemExit(1)
          text=result.stdout
          # Never emit raw logs, tokens, entitlement data, license contents or account identity.
          flags={
            'New Personal licensing route selected': r'Licensing method: personal|Requesting activation \(personal',
            'Activation reports completion': r'Activation complete\.',
            'Unity C# compilation errors present': r'error CS\d+',
            'Account credentials rejected or verification required': r'invalid (?:username|password|credentials)|two.factor|verification code|Unauthorized|InvalidCredentials',
            'Account has no available seat or entitlement': r'No seat available|no available.*seats|0 free entitlements|LICENSE_LIMIT|No valid Unity Editor license|No license activation found',
            'Licensing-client flag unsupported': r'Option .* is unknown|UnknownOptionError',
            'Unity installation or executable missing': r'ENOENT|No such file or directory',
            'Package/dependency resolution problem': r'error.*resolving packages|invalid dependencies|Cannot resolve package',
            'Unity reports successful build': r"Build completed.*Succeeded|Build succeeded|Build Finished.*Success",
            'APK output mentioned': r'Fpp\.apk',
            'Entitlement returned successfully': r'Successfully returned the entitlement license|License has been returned',
            'Disk space exhausted': r'No space left on device',
          }
          classification=[label+': '+str(bool(re.search(pattern,text,re.I))) for label,pattern in flags.items()]
          print('::notice::Classifications:%0A'+'%0A'.join(classification))
          allowed=re.compile(r'error|fail|exception|abort|could not|cannot|not found|invalid|executeMethod|build method|build result|No APK|missing required|ZIP integrity|apksigner|Build completed|Build succeeded|Successfully returned|Fpp\.apk',re.I)
          emitted=0
          errors=[]
          for line in text.splitlines():
              if "Verify fresh APK" in line: continue
              if not allowed.search(line): continue
              if re.search(r'Start importing|GLX_|GL_[A-Z]|LogAssemblyErrors|"error":|bee_backend',line): continue
              if not re.search(r'error CS\d+',line) and re.search(r'password|username|token|secret|serial|<|docker run|--env|unityLicense',line,re.I): continue
              for key in ('UNITY_EMAIL','UNITY_PASSWORD','UNITY_SERIAL'):
                  value=os.environ.get(key,'')
                  if value: line=line.replace(value,'[REDACTED]')
              line=re.sub(r'\b[^\s@]+@[^\s@]+\b','[EMAIL]',line)
              line=re.sub(r'https?://\S+','[URL]',line)
              line=line[:600].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              errors.append(line)
              emitted+=1


          if errors: print("::notice::Sanitized build failure context:%0A"+"%0A".join(list(dict.fromkeys(e for e in errors if re.search(r"error CS\d+",e)))[:12]+errors[-16:]))
