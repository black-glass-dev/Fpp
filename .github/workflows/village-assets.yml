name: Audit supplied village archives
on:
  push:
    branches: [arena/f3a68c52-fpp]
    paths: ['Tools/audit_village_archives.py', '.github/workflows/village-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/f3a68c52-fpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gdown==5.2.0
      - name: Download and inspect all three archives without changing art
        run: python Tools/audit_village_archives.py
      - name: Inspect original embedded base-colour images (previews only)
        run: |
          pip install pillow==12.0.0
          python - <<'PYTEXTURE'
          import json,struct,io,hashlib
          from pathlib import Path
          from PIL import Image
          out=Path('QA/VillageTexturePreviews');out.mkdir(parents=True,exist_ok=True)
          report=[];budget=1200000
          for path in sorted(Path('.asset-staging/village').rglob('*.glb')):
              with path.open('rb') as stream:
                  header=stream.read(20);length=struct.unpack_from('<I',header,12)[0];doc=json.loads(stream.read(length));chunk=stream.read(8);binary=stream.read(struct.unpack_from('<I',chunk)[0])
              row={'source':path.name,'images':[]}
              for material in doc.get('materials',[]):
                  pbr=material.get('pbrMetallicRoughness',{});texture=pbr.get('baseColorTexture')
                  if not texture:continue
                  image=doc['images'][doc['textures'][texture['index']]['source']]
                  if 'bufferView' not in image:continue
                  view=doc['bufferViews'][image['bufferView']];start=view.get('byteOffset',0)
                  picture=Image.open(io.BytesIO(binary[start:start+view['byteLength']])).convert('RGB');original=picture.size;picture.thumbnail((384,384))
                  data=io.BytesIO();picture.save(data,format='JPEG',quality=72,optimize=True);encoded=data.getvalue()
                  key=hashlib.sha256((path.name+material.get('name','')).encode()).hexdigest()[:16]+'.jpg'
                  if len(encoded)<=budget:(out/key).write_bytes(encoded);budget-=len(encoded)
                  row['images'].append({'material':material.get('name',''),'originalSize':original,'factor':pbr.get('baseColorFactor',[1,1,1,1]),'preview':key})
              report.append(row)
          Path('QA/village-texture-inspection.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PYTEXTURE
      - name: Measure original full-detail mesh and image workloads without editing them
        run: |
          python - <<'PYPROFILE'
          import json,struct,io,hashlib
          from pathlib import Path
          from PIL import Image
          report=[];images_by_digest={}
          for path in sorted(Path('.asset-staging/village').rglob('*.glb')):
              with path.open('rb') as stream:
                  header=stream.read(20);length=struct.unpack_from('<I',header,12)[0];doc=json.loads(stream.read(length));chunk=stream.read(8);binary=stream.read(struct.unpack_from('<I',chunk)[0])
              counts=[]
              for mesh in doc.get('meshes',[]):
                  total=0
                  for primitive in mesh['primitives']:
                      count=doc['accessors'][primitive['indices']]['count'] if 'indices' in primitive else doc['accessors'][primitive['attributes']['POSITION']]['count']
                      mode=primitive.get('mode',4)
                      total+=count//3 if mode==4 else max(0,count-2) if mode in (5,6) else 0
                  counts.append(total)
              row={'source':path.name,'uniqueMeshTriangles':sum(counts),'fullDetailNodeTriangleInstances':0,'excludedHelperTriangles':0,'materials':[],'images':[]}
              def walk(index,helper=False):
                  node=doc['nodes'][index];name=node.get('name','').lower()
                  helper=helper or name.startswith('ucx_') or 'collision' in name or name.endswith(('_lod1','_lod2'))
                  if 'mesh' in node:row['excludedHelperTriangles' if helper else 'fullDetailNodeTriangleInstances']+=counts[node['mesh']]
                  for child in node.get('children',[]):walk(child,helper)
              for root in doc['scenes'][doc.get('scene',0)].get('nodes',[]):walk(root)
              for material in doc.get('materials',[]):
                  pbr=material.get('pbrMetallicRoughness',{})
                  row['materials'].append({'name':material.get('name',''),'alphaMode':material.get('alphaMode','OPAQUE'),'doubleSided':material.get('doubleSided',False),'factorAlpha':pbr.get('baseColorFactor',[1,1,1,1])[3],'baseImage':'baseColorTexture' in pbr,'normalImage':'normalTexture' in material,'roughnessImage':'metallicRoughnessTexture' in pbr})
              for image in doc.get('images',[]):
                  if 'bufferView' not in image:continue
                  view=doc['bufferViews'][image['bufferView']];start=view.get('byteOffset',0);data=binary[start:start+view['byteLength']]
                  digest=hashlib.sha256(data).hexdigest();picture=Image.open(io.BytesIO(data));alpha=picture.getchannel('A').getextrema() if 'A' in picture.getbands() else (255,255)
                  row['images'].append({'size':list(picture.size),'sha256':digest,'alphaRange':alpha,'rgba8AllMipsEstimateBytes':int(picture.width*picture.height*4*4/3)})
                  images_by_digest.setdefault(digest,[]).append(path.name)
              report.append(row)
          output={'status':'Original source topology/image metadata only; estimates are NOT Android GPU memory or FPS. No source changed.','models':report,'duplicateEncodedImages':{k:v for k,v in images_by_digest.items() if len(v)>1}}
          Path('QA/village-source-workload.json').write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\n')
          PYPROFILE
      - name: Preserve unchanged sources outside Git
        uses: actions/upload-artifact@v4
        with:
          name: village-original-archives
          path: .asset-staging/village/*.zip
          retention-days: 14
          if-no-files-found: error
      - name: Save full inventory to session branch
        run: |
          git add QA/village-source-workload.json QA/village-source-inventory.json QA/village-texture-inspection.json QA/VillageTexturePreviews
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Inventory every supplied village archive file; art unchanged'
            git pull --rebase origin arena/f3a68c52-fpp
            git push origin HEAD:arena/f3a68c52-fpp
          fi
