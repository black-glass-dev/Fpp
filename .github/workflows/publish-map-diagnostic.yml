name: Publish independently verified compact-map77 phone-test APK
on:
  push:
    branches: [arena/f3a68c52-fpp]
    paths: ['.github/workflows/publish-map-diagnostic.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/f3a68c52-fpp
      - name: Verify exact source, download only the independently signed77 artifact
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/42554853868 --jq .head_sha)" = e9f5042e409fe5fc07758199bb4c64475c3fceb0
          gh run download 42554853868 --name diagnostic-APK-77-NOT-QA-ACCEPTED --dir apk
      - name: Verify complete APK payload and Android signature again
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json
          p=pathlib.Path('apk/Fpp.apk')
          with zipfile.ZipFile(p) as z:
              assert {'AndroidManifest.xml','classes.dex','lib/arm64-v8a/libunity.so','lib/arm64-v8a/libil2cpp.so'}.issubset(z.namelist())
              assert z.testzip() is None
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path('apk/SHA256.txt').write_text(digest+'  Fpp.apk\n')
          pathlib.Path('QA/diagnostic-map-77.json').write_text(json.dumps({'run':'42554853868','source':'e9f5042e409fe5fc07758199bb4c64475c3fceb0','bytes':p.stat().st_size,'sha256':digest,'status':'Signed diagnostic APK; full native XML, gallery and physical-phone acceptance NOT complete'},indent=2)+'\n')
          PY
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify apk/Fpp.apk
      - name: Upload independently verified candidate to existing public prerelease
        run: |
          gh release view diagnostic-map-77 --json tagName
          gh release upload diagnostic-map-77 apk/Fpp.apk apk/SHA256.txt --clobber
      - name: Preserve actual verification receipt, not gameplay acceptance
        run: |
          git add QA/diagnostic-map-77.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record independently verified compact-map77 phone-test APK, native gates pending'
          git pull --rebase origin arena/f3a68c52-fpp
          git push origin HEAD:arena/f3a68c52-fpp
