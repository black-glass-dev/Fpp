name: Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish APK as a GitHub prerelease
        type: boolean
        default: false
  push:
    branches: [arena/f3a68c52-fpp]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android.yml'
      - 'Tools/**'
      - '!Tools/prepare_viewmodel.py'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-mosque:
    if: "!contains(github.event.head_commit.message, '[asset-import]')"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/f3a68c52-fpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and prepare large model on runner
        if: hashFiles('Assets/MosquePack/source-metadata.json') == ''
        continue-on-error: true
        run: |
          pip install -r Tools/requirements-assets.txt gdown==5.2.0
          python Tools/fetch_mosque.py
      - name: Commit converted mosque only after successful validation
        id: source
        run: |
          if [ -f Assets/MosquePack/catalog.json ]; then
            python Tools/validate_assets.py Assets/MosquePack/catalog.json
            python Tools/create_metas.py
            git add Assets/MosquePack Assets/MosquePack.meta
            if [ -f Assets/Resources/MOSQUE_NOTICE.txt ]; then git add Assets/Resources/MOSQUE_NOTICE.txt Assets/Resources/MOSQUE_NOTICE.txt.meta; fi
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "Import optimized user-supplied mosque model"
              git restore --worktree --staged Assets Packages ProjectSettings
              git -c rebase.autoStash=true pull --rebase origin arena/f3a68c52-fpp
              git push origin HEAD:arena/f3a68c52-fpp
            fi
          else
            echo '::warning::Large mosque download/conversion failed. This build cannot include that model.'
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: import-mosque
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import-mosque.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage all supplied village GLBs without modifying source art
        run: |
          pip install gdown==5.2.0 pillow==12.0.0 numpy==2.2.6
          python Tools/stage_village_assets.py
          python Tools/create_metas.py
      - name: Validate model inventory
        run: python Tools/validate_assets.py Assets/PackModels/catalog.json
      - uses: actions/cache@v4
        id: unityCache
        with:
          path: Library
          key: unity-android-2022.3.62f1-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**') }}
          restore-keys: unity-android-2022.3.62f1-
      - name: Build ARM64 APK
        id: unity
        continue-on-error: true
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          cliVersion: v0.1.72
          unityVersion: 2022.3.62f1
          enableGpu: true
          targetPlatform: Android
          buildMethod: Fpp.Editor.AndroidBuild.Build
          customParameters: -fppVersionCode ${{ github.run_number }}
          androidTargetSdkVersion: '35'
      - name: Report editor-method diagnostics without private activation logs
        if: always()
        run: |
          python - <<'PYDIAG'
          import pathlib,re
          p=pathlib.Path('build/fpp-diagnostic.txt')
          if p.is_file():
              lines=[]
              for line in p.read_text(errors='replace').splitlines():
                  if re.search(r'password|token|secret|serial|license|credential',line,re.I):continue
                  line=re.sub(r'[^\s@]+@[^\s@]+','[EMAIL]',line)
                  line=re.sub(r'https?://\S+','[URL]',line)
                  lines.append(line[:600])
              message='\n'.join(lines)[:3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice::Editor build diagnostic:%0A'+message)
          PYDIAG
      - name: Verify fresh APK and signature independently of builder cleanup
        env:
          BUILDER_OUTCOME: ${{ steps.unity.outcome }}
        run: |
          python - <<'PYAPK'
          import pathlib, zipfile
          p=pathlib.Path('build/Android/Fpp.apk')
          if not p.is_file():
              raise SystemExit('No APK produced. See Unity build diagnostics; build is not successful.')
          with zipfile.ZipFile(p) as apk:
              required={'AndroidManifest.xml','classes.dex','lib/arm64-v8a/libunity.so','lib/arm64-v8a/libil2cpp.so'}
              missing=required-set(apk.namelist())
              if missing: raise SystemExit('APK missing required files: '+str(missing))
              if apk.testzip(): raise SystemExit('APK ZIP integrity check failed')
          print('::notice::Fresh ARM64 Unity APK ZIP structure and integrity verified.')
          PYAPK
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify build/Android/Fpp.apk
          sha256sum build/Android/Fpp.apk
          if [ "$BUILDER_OUTCOME" != success ]; then
            echo '::warning::Builder reported a failure, but the fresh signed APK verified. Review builder logs and license return before subsequent runs; APK verification does not prove license cleanup succeeded.'
          fi
      - name: Preserve signed diagnostic APK before native QA
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-APK-${{ github.run_number }}-NOT-QA-ACCEPTED
          path: build/Android/Fpp.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified phone-test APK, explicitly not gameplay acceptance
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.run_number }}
        run: |
          sha256sum build/Android/Fpp.apk > SHA256.txt
          # Draft is prepared by the authorized maintainer; no permission bypass.
          gh release view "diagnostic-map-$NUMBER" --json tagName
          gh release upload "diagnostic-map-$NUMBER" build/Android/Fpp.apk SHA256.txt --clobber
          gh release edit "diagnostic-map-$NUMBER" --draft=false
      - name: Capture complete full-quality scene gallery after signed APK is preserved
        continue-on-error: true
        timeout-minutes: 120
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          allowDirtyBuild: true
          cliVersion: v0.1.72
          unityVersion: 2022.3.62f1
          enableGpu: true
          targetPlatform: Android
          buildMethod: Fpp.Editor.AndroidBuild.CaptureReview
          customParameters: -fppVersionCode ${{ github.run_number }}
      - name: Independently require complete fresh full-quality18-model gallery
        run: |
          python - <<'PYGALLERY'
          from pathlib import Path
          import struct
          progress=Path('QA/runtime/build-progress.txt').read_text()
          names=['unity-spawn','unity-environment','unity-ground-detail','unity-mosque','unity-mosque-entry','unity-mosque-interior','unity-village-pond']+['unity-village-'+str(i).zfill(2) for i in range(18)]
          for name in names:
              path=Path('Docs/Previews')/(name+'.png')
              assert 'CAPTURE END '+str(path) in progress, 'Missing FRESH capture completion: '+name
              with path.open('rb') as f:header=f.read(24)
              assert header[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',header[16:24])==(1280,720), 'Invalid full-resolution PNG: '+name
          print('Fresh full-resolution world/pond/all18 model capture completions verified; human visual acceptance remains separate.')
          PYGALLERY
      - name: Preserve build-time scene evidence before native QA
        uses: actions/upload-artifact@v4
        with:
          name: build-scene-evidence-${{ github.run_number }}
          path: |
            Docs/Previews/unity-*.png
            QA/runtime/village-placement.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve successfully built Unity cache before native QA
        if: steps.unityCache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.unityCache.outputs.cache-primary-key }}
      - name: Fetch pinned test-runner wrapper
        uses: actions/checkout@v4
        with:
          repository: game-ci/unity-test-runner
          ref: 3651041789079526956e876434786ab98af4c8e8
          path: .arena/unity-test-runner
          persist-credentials: false
      - name: Adapt coverage boolean to pinned CLI syntax
        run: |
          python - <<'PYPATCH'
          from pathlib import Path
          p=Path('.arena/unity-test-runner/dist/index.js')
          text=p.read_text()
          if '--no-coverageEnabled' not in text: raise SystemExit('Pinned wrapper changed: review coverage adapter')
          p.write_text(text.replace('--no-coverageEnabled','--coverageEnabled=false'))
          PYPATCH
      - name: Play Mode gameplay tests (real Unity player loop)
        continue-on-error: true
        # Expanded original assets are rendered by a software GPU here; no visual or test assertion is reduced.
        timeout-minutes: 90
        uses: ./.arena/unity-test-runner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          cliVersion: v0.1.72
          unityVersion: 2022.3.62f1
          customImage: unityci/editor:ubuntu-2022.3.62f1-android-3
          chownFilesTo: 1001:1001
          testMode: playmode
          coverageEnabled: false
          githubToken: ''
          artifactsPath: QA/test-results
      - name: Measure actual captured audio (diagnostic, not loudness acceptance)
        if: always()
        run: |
          if [ -f QA/runtime/audio/combat-mix.wav ]; then
            python -m pip install --quiet imageio-ffmpeg==0.6.0
            python Tools/measure_audio_output.py
          fi
      - name: Publish small, credential-free Play Mode result summary
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python Tools/summarize_gameplay_qa.py
          git add QA
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Preserve actual Play Mode result summary'
            git restore --worktree --staged Assets Packages ProjectSettings
            git -c rebase.autoStash=true pull --rebase origin arena/f3a68c52-fpp
            git push origin HEAD:arena/f3a68c52-fpp
          fi
      - name: Reject missing, empty, failed or skipped gameplay test runs
        if: always()
        run: python Tools/require_gameplay_qa.py
      - name: Preserve Play Mode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-qa-${{ github.run_number }}
          path: QA/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve actual Unity render previews
        if: always()
        run: |
          if [ -f Docs/Previews/unity-spawn.png ]; then
            if python -m pip install --quiet pillow==12.0.0 && python Tools/optimize_previews.py; then
              echo "Native preview PNG storage optimized without pixel changes."
            else
              echo '::warning::Optional PNG compression unavailable; preserving original camera pixels.'
            fi
            git add Docs/Previews/unity-*.png
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git diff --cached --quiet; then
              git commit -m "Preserve actual Unity scene and viewmodel render previews"
              git restore --worktree --staged Assets Packages ProjectSettings
              git -c rebase.autoStash=true pull --rebase origin arena/f3a68c52-fpp
              git push origin HEAD:arena/f3a68c52-fpp
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Fpp-Android-${{ github.run_number }}
          path: build/Android/Fpp.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unity-logs-${{ github.run_number }}
          path: |
            **/Editor.log
            **/Unity*.log
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/arena/f3a68c52-fpp' && (github.event_name == 'push' || inputs.publish_release)
    needs: [import-mosque, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fpp-Android-${{ github.run_number }}
          path: apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ needs.import-mosque.outputs.source_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "test-build-${BUILD_NUMBER}" apk/Fpp.apk --target "$BUILD_SHA" --prerelease --title "Android test build ${BUILD_NUMBER}" --notes "Setup/test build, not finished gameplay. ARM64 Android 8+. Full APK update; stable signing must be configured before ongoing distribution."
