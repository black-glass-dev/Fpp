name: Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish APK as a GitHub prerelease
        type: boolean
        default: false
  push:
    branches: [arena/f3a68c52-fpp]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_SERIAL" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo '::error::Configure UNITY_LICENSE (supported Personal activation) or UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD (eligible paid license). Email/password alone is not enough.'
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-android-2022.3.62f1-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**') }}
          restore-keys: unity-android-2022.3.62f1-
      - name: Build ARM64 APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: Fpp.Editor.AndroidBuild.Build
          customParameters: -fppVersionCode ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Fpp-Android-${{ github.run_number }}
          path: build/Android/Fpp.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unity-logs-${{ github.run_number }}
          path: |
            **/Editor.log
            **/Unity*.log
          if-no-files-found: ignore

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/arena/f3a68c52-fpp'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fpp-Android-${{ github.run_number }}
          path: apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "test-build-${BUILD_NUMBER}" apk/Fpp.apk --target "$BUILD_SHA" --prerelease --title "Android test build ${BUILD_NUMBER}" --notes "Setup/test build, not finished gameplay. ARM64 Android 8+. Full APK update; stable signing must be configured before ongoing distribution."
